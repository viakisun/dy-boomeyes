="8" rx="2" fill="#e0e3e8" /><rect x="584" y="287" width="474" height="8" rx="2" fill="#0d2877" /><path d="M 584 320 L 1176 320" fill="none" stroke="#e0e3e8"/><text x="584" y="351" font-size="12px" font-weight="500" fill="#616368" >장비</text><text x="696" y="351" font-size="12px" font-weight="500" fill="#616368" >현장</text><text x="1176" y="351" font-size="12px" font-weight="500" fill="#616368" text-anchor="end">확인할 상태</text><text x="584" y="391" font-size="16px" font-weight="600" fill="#191b1e" >3호기</text><text x="696" y="391" font-size="13px" font-weight="400" fill="#191b1e" >한빛 초등학교 건설 현장</text><text x="1176" y="391" font-size="14px" font-weight="600" fill="#94000f" text-anchor="end">전압 이상</text><text x="584" y="413" font-size="12px" font-weight="400" fill="#616368" >CPB-003</text><text x="1176" y="413" font-size="12px" font-weight="400" fill="#616368" text-anchor="end">342 V · E-021</text><path d="M 584 438 L 1176 438" fill="none" stroke="#e0e3e8"/><text x="584" y="474" font-size="16px" font-weight="600" fill="#191b1e" >4호기</text><text x="696" y="474" font-size="13px" font-weight="400" fill="#191b1e" >대전 B 물류센터</text><text x="1176" y="474" font-size="14px" font-weight="600" fill="#684500" text-anchor="end">수신 중단</text><text x="584" y="496" font-size="12px" font-weight="400" fill="#616368" >CPB-004</text><text x="1176" y="496" font-size="12px" font-weight="400" fill="#616368" text-anchor="end">마지막 수신 08:37</text><path d="M 584 522 L 1176 522" fill="none" stroke="#e0e3e8"/><text x="584" y="558" font-size="16px" font-weight="600" fill="#191b1e" >5호기</text><text x="696" y="558" font-size="13px" font-weight="400" fill="#191b1e" >공장 보관</text><text x="1176" y="558" font-size="13px" font-weight="400" fill="#616368" text-anchor="end">단말기 미장착</text><text x="584" y="580" font-size="12px" font-weight="400" fill="#616368" >CPB-005</text><text x="584" y="634" font-size="13px" font-weight="400" fill="#616368" >위치 · 영상 · 장비 서류</text><text x="1176" y="634" font-size="12px" font-weight="400" fill="#616368" text-anchor="end">전체 5대 중 3대 예시</text><path d="M 72 751 L 1208 751" fill="none" stroke="#e0e3e8"/><text x="72" y="783" font-size="12px" font-weight="400" fill="#616368" >화면 구성 제안 · 소유주 데모 시작</text><text x="1208" y="783" font-size="12px" font-weight="400" fill="#616368" text-anchor="end">가상 데이터 · 제품 구현 전</text></g></svg>
