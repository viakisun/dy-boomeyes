<!doctype html>
<html lang="ko">
<head>
<!-- shared:head -->
<title>BoomEyes — 소유주 운영 현황</title>
<script type="module" src="/src/apps/owner/main.ts"></script>
</head>
<body>

<aside class="rail" aria-label="주 메뉴">
  <div class="logo"><i></i></div>
  <button class="nav on" data-tab="ops" onclick="openTab('ops')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>운영 현황</button>
  <button class="nav" data-tab="fleet" onclick="openTab('fleet')"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>보유 장비</button>
  <button class="nav" data-tab="requests" onclick="openTab('requests')"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/></svg>요청<span class="badge" id="rbadge"></span></button>
</aside>

<header class="top">
  <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
  <div class="right"><button class="bell" id="bell" onclick="toggleInbox()" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="nbadge"></span></button>실시간 · 1분 전 수신<span class="avatar">한</span></div>
</header>
<div class="inbox" id="inbox" hidden></div>

<main class="stage">
  <section class="fleet" id="fleet" hidden></section>
  <section class="fleet req" id="req" hidden></section>
  <div id="map" aria-label="현장 지도"></div>

  <div class="band" role="group" aria-label="장비 상태 요약" id="band"></div>

  <aside class="card" id="card"></aside>
  <div class="wall" id="wall" hidden></div>
  <div class="fullv" id="fullv" hidden></div>
</main>

<div id="notice" class="notice" hidden role="status"></div>
<div id="startup" class="startup" hidden role="alert"></div>
</body>
</html>
