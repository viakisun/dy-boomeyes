# yaml-language-server: $schema=./schema/roles.schema.json
# 생성: tools/ssot/convert_from_archive.py (아카이브 docset v0.3 + v2.0 델타) — 이후 이 파일이 원천
roles:
- id: driver
  name: 운전자
  org: 사업주 소속
  surfaces:
  - A2
  surface_note: A2 운전자 APP
  summary: 배정 장비 1대 — 체크인·일일점검·본인 서류 (소속·배치 = 사업주, DISC-026)
  persona:
    name: 박기사
    env: 폰만 사용 — 장갑·야외·직사광
    goal: 체크인·일일점검·서류 제출을 최소 조작으로
    pain: 복잡한 앱 조작 곤란 · 서류 원본 지참 부담
  demo_account:
    login: driver03
    display: 박기사
- id: site-safety
  name: 현장 안전관리자
  org: 건설사 (현장)
  surfaces:
  - A1
  - B3
  surface_note: A1 APP · B3 WEB
  summary: 현장 업무함의 처리 주체 — 고장·서류·점검 업무 완결
  persona:
    name: 김현장
    env: 현장 사무실 PC 상주 · 순회 시 폰
    goal: 담당 현장의 장비·서류·업무 완결 처리 (동시 1현장)
    pain: 서류 요청 반복 대응 · 고장 시 상황 파악 지연
  demo_account:
    login: safety01
    display: 김현장
- id: hq-safety
  name: 본사 안전관리자
  org: 건설사 (본사)
  surfaces:
  - A3
  - B2
  surface_note: A3 APP · B2 WEB
  summary: 자사 전 현장 열람·확인 요청 — 직접 처리 불가
  persona:
    name: 최본부
    env: 사무실 PC · 이동 중 폰
    goal: 자사 전 현장 안전 현황 파악·경영 보고
    pain: 현장별 전화·방문으로만 파악 — 취합에 반나절
  demo_account:
    login: hq01
    display: 최본부
- id: control
  name: CPB 관제 담당
  org: 운영사 (DY)
  surfaces:
  - B1
  surface_note: B1 전국 스코프 · 읽기 위주 (ADR-012 — 상황실 아님)
  summary: 제조사 전국 운영 뷰 — 가동률·이상 추이·부품 수명 열람 · 정비·AS 연계. 관제 운영 주체는 소유주·건설사
  persona:
    name: 이관제
    env: 사무실 PC · 필요할 때
    goal: 전국 호기 운영 데이터로 정비·부품 판매·모델 개선 계획
    pain: 제조사가 출고 뒤 현장 데이터를 못 봄
  demo_account:
    login: control01
    display: 이관제
- id: maintenance
  name: 정비 담당
  org: 운영사 (DY)
  surfaces:
  - B1
  surface_note: B1 연계 (호출·보고)
  summary: 고장 출동·조치 보고 — 완료 확인은 현장
  persona:
    name: 정정비
    env: 이동 중 폰 · 현장 방문
    goal: 원인을 알고 출동 — 1회 방문 종결
    pain: 증상만 듣고 출동 → 재방문 빈발
  demo_account:
    login: maint01
    display: 정정비
- id: ops-admin
  name: CPB 운영 관리자
  org: 운영사 (DY)
  surfaces:
  - B4
  surface_note: B4 백오피스
  summary: 호기·현장·사용자·프로토콜·알림 기준 마스터 관리
  persona:
    name: 오운영
    env: 사무실 PC
    goal: 호기·현장·계약·알림 기준 마스터 관리 · 예지보전 기준 운영 (제조사 관점)
    pain: 기준값이 경험치 — 실측 근거 부족
  demo_account:
    login: ops01
    display: 오운영
- id: owner
  name: 사업주 (장비 소유주)
  org: 사업주
  surfaces:
  - B1
  - A4
  surface_note: B1 운영 WEB(PC) + A4 PWA(폰) — 1단계 주인공 (ADR-012 · DISC-060)
  summary: DY CPB를 다수 구매·보유한 중기업체 — 전국 임대 영업 · 보유 호기 관리·관제 · 투입 요청 승인·배정 · 운전자 배치 · 계약. 원 의뢰자
  persona:
    name: 차사장
    env: 사무실 PC(B1) + 이동 중 폰(A4)
    goal: 보유 100대가 어디서 얼마나 가동되는지 한 화면에서 · 요청 승인·배정·운전자 배치 · 현장에 관제를 제공해 영업
    pain: 가용 대수를 수첩·전화로 관리 — 요청 올 때마다 현장별 전화 확인 · 어느 호기가 놀고 있는지 모름
  demo_account:
    login: owner01
    display: 차사장
