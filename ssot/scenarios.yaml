# 생성: tools/ssot/convert_from_archive.py (아카이브 docset v0.3 + v2.0 델타) — 이후 이 파일이 원천
personas:
- name: 최본부
  role: 본사 안전관리팀장
  org: 건설사(본사)
  env: 사무실 PC · 이동 중 폰
  goal: 자사 전 현장 안전 현황 파악·경영 보고
  pain: 현장별 전화·방문으로만 파악 — 취합에 반나절
  surfaces: A3 APP · B2 WEB
- name: 김현장
  role: 현장 안전관리자
  org: 건설사(현장)
  env: 현장 사무실 PC 상주 · 순회 시 폰
  goal: 담당 현장의 장비·서류·업무 완결 처리 (동시 1현장)
  pain: 서류 요청 반복 대응 · 고장 시 상황 파악 지연
  surfaces: A1 APP · B3 WEB
- name: 박기사
  role: CPB 운전자
  org: 사업주 소속
  env: 폰만 사용 — 장갑·야외·직사광
  goal: 체크인·일일점검·서류 제출을 최소 조작으로
  pain: 복잡한 앱 조작 곤란 · 서류 원본 지참 부담
  surfaces: A2 APP
- name: 차사장
  role: CPB 사업주 (장비 소유주)
  org: 사업주
  env: 폰 위주 · 사무실 PC 병행
  goal: 보유 호기 가용·투입 파악 · 요청 승인·배정·운전자 배치를 한 화면에서
  pain: 가용 대수를 수첩·전화로 관리 — 요청 올 때마다 현장별 전화 확인
  surfaces: A4 PWA (2단계 제안)
- name: 이관제
  role: CPB 관제 담당
  org: DY(관제)
  env: 관제실 대형 모니터 상시
  goal: 전국 호기 이상 조기 감지 · 원격 진단 후 정비 연결
  pain: 장비 상태를 실시간으로 알 방법이 없음
  surfaces: B1 WEB
- name: 정정비
  role: 정비 담당
  org: DY(정비)
  env: 이동 중 폰 · 현장 방문
  goal: 원인을 알고 출동 — 1회 방문 종결
  pain: 증상만 듣고 출동 → 재방문 빈발
  surfaces: B1 연계 (호출·조치 보고)
- name: 오운영
  role: CPB 운영 관리자
  org: DY(운영)
  env: 사무실 PC
  goal: 호기·현장·계약·알림 기준 마스터 관리 · 예지보전 기준 운영 (제조사 관점)
  pain: 기준값이 경험치 — 실측 근거 부족
  surfaces: B4 백오피스
scenarios:
- id: A
  title: 현장 개설 전 (D-7 ~ D-0)
  prep:
    건설사:
    - 안전관리자·운전자 인선 (D-7)
    - 현장 정보 (현장명·주소·기간·발주처)
    - 운전자 서류 원본 (면허·교육 이수증)
    - 현장 전원·설치 여건 (CPB 반입 일정)
    DY:
    - 계정 발급 (안전관리자·운전자 — B4-04)
    - 호기 선정·임대 계약 (B4-03)
    - 제어기·CCTV·LTE 장착·개통 (WP-C3 — DISC-001~004)
    - 장비 서류 등록 (제작증·비파괴)
    - 텔레메트리 수신 검증 (B1-02)
- id: B
  title: 현장 운영
  prep:
    건설사:
    - 일일점검 수행 체계 (운전자 교육)
    - 고장 완료 확인 책임 (현장 안전관리자)
    - 서류 만료 관리 (재제출 기한 준수)
    DY:
    - 관제·원격 진단 상시 운영 (B1)
    - 정비 출동·조치 보고
    - 알림 기준 관리 (E-코드·소모품 임계 — B4-05)
    - 고장코드·임계값 기준 제공 (WP-C2 — DISC-012~014)
- id: C
  title: 현장 완료 (종료)
  prep:
    건설사:
    - 미결 업무 정리 (종료 전 완료 처리)
    - 장비 반출 일정 협의
    DY:
    - 장비 회수·점검·재배치
    - 계약 종료 정산
    - 이력·서류 보존 (DISC-022 기준)
