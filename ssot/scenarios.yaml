narrative:
- title: 개설 전 — 공사 시작 일주일
  paragraphs:
  - '9월 30일의 관건은 하나다. 현장의 장비와 카메라가 보내는 데이터가 시스템에 들어오는 것 — 제어기의 GPS·CAN·전압·고장코드 신호와 카메라의 실시간 영상이 관제 화면에 정상으로 잡히면, 1단계 시연의 핵심
    목표는 달성된다(우선순위 확정: DISC-025). 현장 개설이나 서류 같은 업무 흐름은 그다음에 확인하는 이후의 일이고, 2단계 완료 후에는 전 흐름이 시스템 안에서 완결된다.'
  - 그래서 개설 전 일주일의 중심에는 정정비와 이관제가 있다. 정정비는 배정된 장비에 제어기와 CCTV가 제대로 장착됐는지, LTE가 개통됐는지 확인하고 카메라 두 대를 점검한다. 전방 카메라의 화각과 초점, 붐 끝
    하향 카메라의 시야까지 본다(2단계에서는 현장 프로파일에 따른 녹화·업로드 동작도 확인한다). 이관제는 관제실에서 장비가 보내오는 GPS·CAN·전압 신호와 영상 스트림이 정상인지 검증한다. 여기까지가 9월 30일의
    핵심 경로다.
  - 업무 흐름은 그 곁에서 준비된다. 공사 착수 일주일 전, 건설사 본사의 최본부 팀장이 신규 현장의 안전관리자로 김현장을 지정하고 계정을 확보한다 — 9월 30일 시점에는 DY의 오운영이 백오피스에서 계정을 발급해
    주고, 2단계 완료 후에는 김현장이 직접 회원가입한다(가입 방식은 DISC-023 협의 결과에 따른다). 김현장은 앱에서 현장 개설을 신청한다. 현장명과 주소, 공사 기간을 입력하면 이관제가 수신함에서 신청을 확인해
    승인하고, 오운영이 현장을 등록해 김현장과 연결한다.
  - CPB를 내주는 것은 DY가 아니라 사업주다. 차사장은 CPB 여러 대를 보유하고 건설 현장에 임대하는 장비 사업주로, 박기사도 차사장 회사 소속 운전자다. 김현장이 CPB 투입을 요청하면 차사장이 받는다 — 지금
    몇 대가 나갈 수 있는지, 몇 대가 현장에 나가 있고 몇 대가 정비 중인지 확인하고, 가용 호기를 골라 배정하며 운전자까지 붙인다. 임대 계약을 등재하는 것도 차사장의 일이다. 9월 30일 시점에는 이 흐름이 시스템
    밖(전화·수기)에서 돌고 오운영이 백오피스(B4-03)에 대신 입력하지만, 2단계 완료 후에는 차사장이 사업주 앱(A4)에서 요청 수신부터 배정 확정까지 직접 처리한다(DISC-026).
  - 나흘 전, 차사장이 박기사를 운전자로 배치하고 박기사가 앱에 로그인한다. 서류가 이어진다 — DY가 장비의 제작증과 비파괴 검사 성적서를 등록하고, 운전자 서류(면허·교육 이수증)는 소속 회사인 차사장 쪽이 챙긴다.
    박기사가 휴대폰으로 촬영해 제출하면 김현장이 확인한다. 9월 30일 시점에는 제출과 열람까지이고, 2단계 완료 후에는 김현장이 승인·반려하고 반려되면 재제출하는 워크플로가 돈다.
  - 하루 전 김현장은 앱에서 장비 목록과 실시간 영상을 확인한다 — 데이터 인입의 마지막 검증이다. 최본부는 담당 현장의 개설 상태를 열람한다. 당일 아침, 박기사가 출근 체크인을 하고 작업 전 일일점검을 제출하면
    현장이 가동을 시작한다.
- title: 운영 — 현장의 일상
  paragraphs:
  - 운영의 중심에도 데이터가 있다. 이관제는 관제실에서 전국 장비를 지도로 상시 감시한다 — 장비가 보내는 상태·전압·위치가 실시간으로 갱신되고, 김현장은 현장 콘솔에서 장비 상태와 실시간 영상을 본다. 여러 대를
    볼 때는 5~10초 주기 스냅샷으로, 필요하면 본 스트림으로 전환한다. 2단계 완료 후에는 서버에 저장된 하루치 영상도 조회하고, 붐 끝 카메라가 붐 하부의 사람을 감지하면 경고가 온다. 영상이 끊기면 「영상 없음」
    표시가 뜨고, 김현장이 점검을 요청하면 정정비가 카메라 고장인지 통신 두절인지 구분해 조치한다. 이 데이터 경로가 살아 있는 것이 9월 30일 시연의 핵심이다.
  - 고장 데이터도 같은 경로로 들어온다. 예컨대 E-021 전압 이상 — 이관제가 코드를 수신해 원격으로 진단하고 정정비를 호출한다. 동시에 김현장의 업무함에 고장 티켓이 발행된다. 정정비는 원인을 알고 출동하므로
    부품을 준비해 간다. 조치를 보고하면 김현장이 완료를 확인해야 티켓이 닫힌다. 1시간 안에 아무도 접수하지 않으면 최본부와 관제에 자동 통보된다(에스컬레이션).
  - 업무 흐름은 그 위에서 돈다. 매일 아침은 박기사의 체크인과 일일점검으로 열리고, 빠지면 김현장의 업무함에 미출근·미점검 업무가 생긴다. 최본부는 자사 현장 현황을 열람한다 — 직접 처리는 못 하고 확인 요청만
    보낼 수 있다. 수송관과 필터는 임계에 도달하면 박기사와 김현장에게 알림이 오고, 서류는 만료 30일 전에 재제출 알림이 온다.
  - 제조사인 DY는 이 기간 내내 데이터를 쌓는다. 9월 30일 시점에는 오운영이 임계 규칙(전압·소모품·고장 반복)을 모니터링하는 수준이지만, 2단계 완료 후에는 축적된 추세가 일한다 — 도달률 추세와 사용 시간으로
    부품 수명을 예측해 예지 알림이 오면, 정정비가 고장 나기 전에 선제 정비를 계획하고 부품을 준비해 방문한다. 오운영은 실측 데이터로 임계 기준값을 보정한다. 최본부는 주간·월간 리포트로 현장을 본다(12/31판).
- title: 완료 — 현장 종료와 순환
  paragraphs:
  - 공사가 끝나면 김현장이 종료를 신청하고 이관제가 승인한다. 진행 중인 티켓을 정리하고, 박기사는 마지막 체크아웃을 한다. 정정비가 장비를 회수한다 — 제어기·카메라·LTE 단말까지 함께 반납 점검하고, 2단계 완료
    후에는 회수 장비의 운행 데이터를 리뷰해 다음 예지 모델의 재료로 넘긴다. 오운영이 임대 계약을 종료 처리하면 호기는 다음 현장을 기다린다.
  - 업무·조치·서류 이력은 수정 불가 형태로 보존된다(보존 기간은 DISC-022 협의). 2단계 완료 후에는 현장 전체 기간의 운영 리포트가 아카이브된다. 김현장이 다음 현장을 맡으면 — 현장 전환은 동시 1현장
    원칙에 따라 — 다시 개설 신청부터 시작한다.
