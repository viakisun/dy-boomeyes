<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoomEyes — 건설사 현장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#075A60">
<script type="module" src="/src/apps/builder/main.ts"></script>
</head>
<body>

<aside class="rail" aria-label="주 메뉴">
  <div class="logo"><i></i></div>
  <button class="nav on" onclick="showSiteList()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>우리 현장</button>
</aside>

<header class="top">
  <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
  <div class="right"><button class="bell" id="bell" onclick="toggleInbox()" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="nbadge"></span></button>실시간 · 1분 전 수신<span class="avatar">한</span></div>
</header>
<div class="inbox" id="inbox" hidden></div>

<main class="stage">
  <div id="map" aria-label="현장 지도"></div>

  <div class="band" role="group" aria-label="장비 상태 요약" id="band"></div>

  <aside class="card" id="card"></aside>
  <div class="wall" id="wall" hidden></div>
  <div class="fullv" id="fullv" hidden></div>
</main>

<div id="notice" class="notice" hidden role="status"></div>
<div id="startup" class="startup" hidden role="alert"></div>
</body>
</html>
