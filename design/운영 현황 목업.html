<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영 현황 — 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#F4F6F8; --line:#DDE3E8; --ink:#172D39; --ink2:#40616E; --ink3:#7A909B;
    --accent:#075A60; --accent-soft:#E3F0F0;
    --fault:#C0392B; --check:#B7791F; --late:#8A5A00; --store:#6B7C86; --run:#1F7A4D;
    --mono:'IBM Plex Mono',monospace; --sans:'Noto Sans KR',system-ui,sans-serif;
    --shadow:0 1px 2px rgba(23,45,57,.06),0 6px 20px rgba(23,45,57,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);height:100vh}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  .rail{grid-row:1/3;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:2}
  .logo{width:36px;height:36px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;margin-bottom:14px}
  .logo i{width:12px;height:12px;background:var(--ink);border-radius:2px;transform:rotate(45deg)}
  .nav{width:56px;padding:9px 0 7px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink3);font-size:10.5px}
  .nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav.on{color:var(--accent);background:var(--accent-soft)}
  .nav:hover{background:var(--bg)}

  .top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;z-index:2}
  .top .title{font-weight:700;font-size:15px}
  .crumb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink3)}
  .crumb b{color:var(--ink);font-weight:700}.crumb .sep{color:var(--line)}
  .crumb button{color:var(--ink3);font-size:14px}.crumb button:hover{color:var(--accent)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;font-family:var(--sans)}

  .stage{position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#E6ECEF}
  #map.site{background:#E9ECEE}
  #map.site .leaflet-tile-pane{filter:grayscale(.75) saturate(.6) brightness(1.04) contrast(.95)}
  .leaflet-control-attribution{font:10px var(--mono);color:var(--ink3);background:rgba(255,255,255,.85)}
  .leaflet-control-zoom{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}
  .leaflet-control-zoom a{color:var(--ink)!important}

  .band{position:absolute;left:20px;top:18px;z-index:500;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:0 4px;height:44px;max-width:calc(100% - 40px);overflow:hidden}
  .band .cell{display:flex;align-items:baseline;gap:6px;padding:0 14px;font-size:12.5px;color:var(--ink2);border-left:1px solid var(--line);white-space:nowrap}
  .band .cell:first-child{border-left:0}
  .band .cell b{font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .band .cell.total b{font-size:20px}
  .band .cell.fault b{color:var(--fault)}.band .cell.check b{color:var(--check)}.band .cell.late b{color:var(--late)}
  .band .cell.dim b{color:var(--ink3);font-weight:500}

  .lvl{display:none}
  .lvl button{padding:7px 14px;border-radius:7px;font-size:12.5px;color:var(--ink3)}
  .lvl button.on{background:var(--ink);color:#fff;font-weight:500}
  .lvl button:disabled{opacity:.4;cursor:default}

  /* floating card (context panel) */
  .card{position:absolute;left:20px;top:78px;z-index:500;width:340px;max-height:calc(100% - 98px);display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .card.wide{width:360px}
  .card.unit{width:min(560px,calc(100% - 40px));top:18px;max-height:calc(100% - 38px)}
  body.vB .card.unit,body.vC .card.unit{top:66px;max-height:calc(100% - 86px)}
  .card .body{overflow:auto;min-height:0;scrollbar-width:thin}
  .band.hide{display:none}
  .stat{padding:14px 18px 16px;border-bottom:1px solid var(--line)}
  .stat .h{display:flex;align-items:baseline;gap:10px}
  .stat .h .rx{margin-left:auto}
  .stat .h b{font-size:18px;font-weight:700}
  .stat .h span{font:400 12px var(--mono);color:var(--ink3)}
  .stat .st{margin-top:10px;font-size:13px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .stat .st b{font-weight:700}
  .stat .st i{width:8px;height:8px;border-radius:50%;background:var(--run);flex:none;align-self:center}
  .stat .st .why{color:var(--ink);font-weight:500}
  .stat .st .when{font:400 12px var(--mono);color:var(--ink3)}
  .stat .st.fault{color:var(--fault)}.stat .st.fault i{background:var(--fault)}
  .stat .st.check{color:var(--check)}.stat .st.check i{background:var(--check)}
  .stat .st.late{color:var(--late)}.stat .st.late i{background:var(--late)}
  .stat .st.store{color:var(--store)}.stat .st.store i{background:var(--store)}
  .fold{border-top:1px solid var(--line);background:#fff}
  .fold summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) 10px;gap:10px;align-items:center;font-size:13px;font-weight:600;color:var(--ink)}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary .hint{font:400 12px var(--sans);color:var(--ink3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fold summary .hint.soon{color:var(--check);font-weight:500}.fold summary .hint.bad{color:var(--fault);font-weight:600}
  .fold summary .chev{width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);transition:transform .15s}
  .fold[open] summary .chev{transform:rotate(-135deg)}
  .fold > .parts,.fold > .kv,.fold > .docs{padding:2px 18px 16px;margin:0}
  .fold > .kv{display:grid}
  .stat .meta{margin-top:4px;font:400 12px var(--mono);color:var(--ink3)}
  .stat .meta b{font-weight:500;color:var(--ink)}
  .stat .meta b.late{color:var(--late)}
  .stat .h b.fault{color:var(--fault)}.stat .h b.check{color:var(--check)}.stat .h b.late{color:var(--late)}.stat .h b.store{color:var(--store)}
  .stat .h span{font:400 12px var(--mono);color:var(--ink3)}
  .stat .facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2)}
  .stat .facts b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .stat .facts b.bad{color:var(--fault)}.stat .facts b.late{color:var(--late)}
  .stat .act{display:flex;gap:8px;margin-top:12px}
  .stat .act button{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
  body.vB .stat .act{flex-direction:column;align-items:stretch}
  body.vB .stat .act button{justify-content:center}
  .stat .act button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .stat .act button:hover{border-color:var(--ink)}
  .unit .video .live{font-family:var(--mono);font-size:11px}
  .unit .video{width:100%;aspect-ratio:auto;height:clamp(120px,calc(100vh - 520px),300px)}
  .card header{padding:14px 18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .card h2{margin:0;font-size:14.5px;font-weight:700}
  .card h2 small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px}
  .card header a,.card header button{font-size:12px;color:var(--accent);white-space:nowrap}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
  .row:hover,.row.hl{background:var(--bg)}
  .row.on{background:var(--accent-soft)}
  .row .nm{font-weight:500;font-size:13.5px;line-height:1.3}
  .row .sub{font-size:12px;color:var(--ink3);margin-top:1px}
  .row .sub em{font-style:normal;font-weight:500}
  .row .cnt{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap;line-height:1.5}
  .row .cnt.late{color:var(--late)}
  .card details{border-top:1px solid var(--line);background:#FAFBFC}
  .card summary{list-style:none;cursor:pointer;padding:10px 18px;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .card summary::-webkit-details-marker{display:none}
  .card summary .chev{width:7px;height:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);transition:transform .15s;flex:none}
  .card details[open] summary .chev{transform:rotate(-135deg)}
  .card details .sec{padding-top:0}
  .card .sec .call{margin-top:8px}
  .card footer{border-top:1px solid var(--line);padding:10px 18px;font-size:11.5px;color:var(--ink3);line-height:1.55;background:#FAFBFC}

  /* site / unit panel pieces */
  .hd{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  .hd .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3);margin-bottom:4px}
  .hd h2{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:500;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .tag.fault{color:var(--fault);border-color:var(--fault)}.tag.check{color:var(--check);border-color:var(--check)}.tag.late{color:var(--late);border-color:var(--late)}.tag.run{color:var(--run);border-color:#B9D9C6}
  .hd .addr{font-size:12.5px;color:var(--ink2);margin-top:2px}
  .sec{padding:14px 18px;border-bottom:1px solid var(--line)}
  .sec h3{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--ink3)}
  .kv{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;font-size:13px}
  .kv dt{color:var(--ink3);font-size:12px;padding-top:1px}.kv dd{margin:0;font-weight:500}
  .kv dd.late{color:var(--late)}
  .bar{position:relative;height:5px;background:#E6ECEF;border-radius:3px;margin:6px 0 4px}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px}
  .bar b{position:absolute;top:-4px;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--ink);transform:translateX(-50%)}
  .dates{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  .dates .r{color:var(--ink3);text-align:right}
  .person{display:flex;align-items:center;gap:12px}
  .person .av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
  .person .nm{font-weight:700;font-size:14px}.person .rl{font-size:12px;color:var(--ink3)}
  .call{display:flex;gap:8px;margin-top:12px}
  .call button{flex:1;height:38px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
  .call button:hover{border-color:var(--ink)}
  .call button.ic{flex:0 0 42px}
  .video{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(135deg,#E6ECEF,#E6ECEF 8px,#DDE3E8 8px,#DDE3E8 16px);display:grid;place-items:center}
  .video .lbl{font-family:var(--mono);font-size:11px;color:var(--ink2);background:#fff;padding:5px 9px;border:1px solid var(--line);border-radius:6px}
  .video .live{position:absolute;left:10px;top:10px;font-size:11px;color:#fff;background:var(--ink);padding:3px 8px;border-radius:6px}
  .video .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(23,45,57,.85))}
  .seg2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .seg2 button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink2)}
  .seg2 button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cams{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
  .cams button{position:relative;aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px;background-color:#DDE3E8;background-repeat:no-repeat;font:500 10.5px var(--sans);color:#fff;display:flex;align-items:flex-end;padding:4px 6px;text-align:left;line-height:1.2;overflow:hidden;filter:saturate(.7)}
  .cams button span{position:relative;text-shadow:0 0 3px rgba(23,45,57,.9),0 0 6px rgba(23,45,57,.6);white-space:nowrap}
  .cams button::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(23,45,57,.55))}
  .cams button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);filter:none}
  .cams button.ai::before{content:'AI';position:absolute;top:4px;right:5px;z-index:1;font:700 9px var(--mono);color:#fff;background:var(--accent);padding:1px 4px;border-radius:3px}
  .video{background-repeat:no-repeat;background-color:#DDE3E8}
  .video .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E5484D;margin-right:6px;vertical-align:1px}
  .video .ts{position:absolute;right:10px;top:10px;font:400 10.5px var(--mono);color:#fff;background:rgba(23,45,57,.75);padding:3px 7px;border-radius:5px}
  .video.ai .live{background:var(--accent)}
  .unit .video.ai{height:auto;aspect-ratio:1000/690;max-height:none}
  .det{position:absolute;border:1.5px solid #19A974;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
  .det span{position:absolute;left:-1.5px;top:-20px;font:600 10px var(--mono);color:#fff;background:#19A974;padding:2px 6px;border-radius:3px;white-space:nowrap}
  .det.t{border-color:var(--accent)}.det.t span{background:var(--accent)}
  .det.z{border:1.5px dashed #E5484D;border-radius:6px}
  .det.z span{background:#E5484D;top:auto;bottom:-20px;left:auto;right:-1.5px}
  .vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .vhead h3{margin:0;white-space:nowrap}
  .vhead .seg2{margin:0}
  .vhead .seg2 button{padding:3px 9px;font-size:11.5px}
  .docs{display:flex;flex-direction:column;gap:6px}
  .docs a{display:flex;justify-content:space-between;font-size:13px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  .docs a:hover{border-color:var(--ink);text-decoration:none}
  .docs a span{font-family:var(--mono);font-size:11px;color:var(--ink3)}

  /* ---- layout variants for the unit level ---- */
  .variant{position:absolute;right:20px;top:18px;z-index:600;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
  .variant span{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--ink3);padding:0 10px 0 8px}
  .variant button{padding:6px 11px;border-radius:7px;font-size:12px;color:var(--ink3)}
  .variant button.on{background:var(--ink);color:#fff;font-weight:500}
  .minislot{height:130px;margin:0 18px 14px;border-radius:8px;background:#E9ECEE;flex:0 1 130px;min-height:60px}
  .card.unit .body{flex:1 1 auto;min-height:170px}
  .card.unit .stat{border-bottom:0}
  .card.unit .sec{border-top:1px solid var(--line);border-bottom:0}
  .sh{margin:0 0 10px;font-size:12px;font-weight:500;color:var(--ink3);display:flex;justify-content:space-between;align-items:baseline}
  .sh a{font-size:12px;font-weight:400}
  .tele{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
  .tele div{display:flex;flex-direction:column;gap:2px}
  .tele span{font-size:11px;color:var(--ink3);white-space:nowrap}
  .tele span.val{font-size:inherit;color:inherit}
  .tele b{font:600 16px var(--mono);letter-spacing:-0.02em;color:var(--ink);line-height:1.2}
  .tele .val{display:flex;align-items:baseline;gap:3px}
  .tele b.bad{color:var(--fault)}
  .tele small{font:400 10.5px var(--mono);color:var(--ink3)}
  .parts{display:flex;flex-direction:column;gap:8px}
  .part{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:12.5px}
  .part .nm{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .part .bar{position:relative;height:5px;background:#E6ECEF;border-radius:3px;margin:0}
  .part .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:3px}
  .part .bar em{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink3)}
  .part .bar.days i{background:var(--ink3)}
  .part .v{font:500 12px var(--mono);color:var(--ink2);text-align:right}
  .part.soon .bar i{background:var(--check)}.part.soon .v{color:var(--check)}
  .part.bad .bar i{background:var(--fault)}.part.bad .v{color:var(--fault);font-weight:700}
  .card .foot{border-top:1px solid var(--line);background:#FAFBFC}
  .card .foot details{border-top:0}
  .docs-link{display:flex;justify-content:space-between;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
  .docs-link:hover{text-decoration:none;color:var(--accent)}
  .variant[hidden],.wall[hidden],.dock[hidden]{display:none}
  body.vB #map{left:auto;right:auto;top:auto;width:284px;height:170px;border:1px solid var(--line);border-radius:8px;z-index:600}
  body.vB #map .leaflet-control-zoom,body.vB #map .leaflet-control-attribution{display:none}
  body.vB .card.unit{width:340px}
  .wall{position:absolute;left:380px;right:20px;top:66px;bottom:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:min-content;align-content:center;gap:10px;z-index:500}
  .wall .feed{aspect-ratio:16/9}
  .wall .feed{position:relative;border-radius:10px;overflow:hidden;background:#DDE3E8 no-repeat;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent}
  .wall .feed.on{border-color:var(--ink)}
  .wall .feed .live{position:absolute;left:10px;top:10px;font:500 11px var(--mono);color:#fff;background:var(--ink);padding:3px 8px;border-radius:6px}
  .wall .feed .live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#E5484D;margin-right:6px;vertical-align:1px}
  .wall .feed.ai .live{background:var(--accent)}
  .wall .feed .ts{position:absolute;right:10px;bottom:8px;font:400 10.5px var(--mono);color:#fff;text-shadow:0 0 4px rgba(23,45,57,.9)}
  .wall .feed .det span{font-size:9px;padding:1px 4px;top:-16px}
  .wall .feed .det.t span{left:auto;right:-1.5px}
  .wall .feed .det.z span{top:-16px;left:-1.5px;right:auto;bottom:auto}
  .wall .feed .det.p span{left:auto;right:-1.5px}
  .wall .feed.ai .ts{display:none}
  .wall .feed.ai:hover::after{opacity:0}

  const w = $('#wall'); if (w.hidden) return; const n = state.unit.cams.length, gap = 12, W = w.clientWidth, H = w.clientHeight; let best = null;
  for (const cols of [3, 2]) { const rows = Math.ceil(n / cols); let tw = (W - gap * (cols - 1)) / cols, th = tw * 9 / 16; if (rows * th + gap * (rows - 1) > H) { th = (H - gap * (rows - 1)) / rows; tw = th * 16 / 9; } if (!best || tw > best.tw) best = { cols, tw }; }

      if (d < MIN) { const push = (MIN-d)/2; dx/=d; dy/=d; a.x-=dx*push; a.y-=dy*push; b.x+=dx*push; b.y+=dy*push; moved = true; }
    }

    if (!moved) break;

  }

  const overlap = (r) => taken.reduce((a,t) => a + Math.max(0, Math.min(r.right,t.right)-Math.max(r.left,t.left)) * Math.max(0, Math.min(r.bottom,t.bottom)-Math.max(r.top,t.top)), 0);
  for (const m of mks) {

/* ---------- hover sync ---------- */
const sync = (key, val, on) => document.querySelectorAll(`[data-${key}="${val}"]`).forEach(el => el.classList.toggle('hl', on));
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-site],[data-unit]'); if (!t) return; if (t.dataset.site) sync('site', t.dataset.site, true); if (t.dataset.unit) sync('unit', t.dataset.unit, true); });
document.addEventListener('mouseout',  e => { const t = e.target.closest('[data-site],[data-unit]'); if (!t) return; if (t.dataset.site) sync('site', t.dataset.site, false); if (t.dataset.unit) sync('unit', t.dataset.unit, false); });
addEventListener('resize', () => render());

render();
</script>
</body>
</html>
