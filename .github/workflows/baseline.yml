# 시각 회귀 기준선 갱신 (ADR-008 A) — 사람이 실행(workflow_dispatch): 선택한 브랜치에서 DPR 1 기본 상태 캡처 → shots/baseline 커밋·푸시
# 기준선은 이 러너(ubuntu · Playwright chromium 고정 버전 · fonts-noto-cjk)에서만 만든다 — 로컬(macOS) 렌더는 글꼴이 달라 비교 대상이 아니다
name: baseline
on:
  workflow_dispatch:
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: capture:accept (DPR 1 · 기본 상태 · 지도/비디오 마스크)
        run: pnpm capture:accept
      - name: commit baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shots/baseline
          if git diff --cached --quiet; then echo "기준선 변경 없음"; exit 0; fi
          git commit -m "chore(capture): 시각 회귀 기준선 갱신 — CI ubuntu · $(node -p "require('./shots/baseline/MANIFEST.json').shots")장" -m "Refs: ADR-008"
          git push
