name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: gates (ssot · tokens · 생성물 최신성)
        run: pnpm verify
      - name: commit trailers (Refs)
        if: github.event_name == 'pull_request'
        run: node tools/ssot/check.mjs --commits origin/${{ github.base_ref }}..HEAD
      - name: docs · specs
        run: node tools/ssot/check.mjs --docs && node tools/ssot/check.mjs --specs
