name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: gates (ssot · tokens · 생성물 최신성)
        run: pnpm verify
      - name: commit trailers (Refs)
        if: github.event_name == 'pull_request'
        run: node tools/ssot/check.mjs --commits origin/${{ github.base_ref }}..HEAD
      - name: docs · specs
        run: node tools/ssot/check.mjs --docs && node tools/ssot/check.mjs --specs
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: e2e (역할 로그인 8 · 대시보드 · axe)
        run: pnpm e2e
      - name: capture (라우트 × 상태 전수 · 기본 상태 다크 변형 · 자리 화면 0)
        run: pnpm capture --dark --strict
      - name: visual regression (ADR-008 · shots/baseline 대비 픽셀 차 0.2% · 지도·비디오 마스크)
        run: pnpm capture:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-and-report
          path: |
            shots/
            playwright-report/
            test-results/
          retention-days: 14
